[project]
name = "django-autotranslate"
version = "2.0.0"
description = "Automatically translate the pot (.po) files generated by Django's makemessages command using machine translation services."
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "django>=4.2,<6.0",
    "django-typer>=3.1,<3.2",
    "googletrans>=4.0.2",
    "polib>=1.2.0",
]
authors = [
  {name = "Ankit Popli", email = "ankitpopli1891@gmail.com"},
  {name = "Brian Kohan", email = "bckohan@gmail.com"},
]
license = "MIT"
license-files = [ "LICENSE" ]
repository = "https://github.com/ankitpopli1891/django-autotranslate"
homepage = "https://django-autotranslate.readthedocs.io"
keywords = ["django",  "i18n", "translate", "cli"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/autotranslate"]


[dependency-groups]
dev = [
    "coverage>=7.6.12",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.10.0",
    #"rich>=13.9.4",
    "ruff>=0.9.7",
    "tox>=4.24.1",
]
docs = [
    "doc8>=1.1.2",
    "furo>=2024.8.6",
    "readme-renderer[md]>=44.0",
    "sphinx>=7.4.7",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-django>=2.5",
    "sphinxcontrib-typer[png]>=0.5.1",
]

[project.optional-dependencies]
google = ["google-api-python-client>=2.162.0"]
amazon = ["boto3>=1.37.1"]
# this should track typer's rich dependency, so long as our console
# patches still work - so be sure to test on the low end of the range
rich = ["rich>=10.11.0,<14.0.0"]

[tool.ruff]
line-length = 88
exclude = [
    "doc",
    "dist"
]

[tool.ruff.lint]
exclude = [
    "tests/**/*"
]

[tool.doc8]
max-line-length = 100
sphinx = true
ignore = [ "D004" ]

[tool.pytest.ini_options]
# py.test options:
DJANGO_SETTINGS_MODULE = "tests.settings.base"
python_files = "test_*.py"
norecursedirs = "*.egg .eggs dist build docs .tox .git __pycache__ shellcompletion"
env = [
    "TERMINAL_WIDTH=80",
]

addopts = [
  "--strict-markers",
  "--cov=autotranslate",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered"
]

filterwarnings = [
    "ignore:.*shell_complete.*:DeprecationWarning:typer.core"
]

[tool.coverage.run]
branch = true
source = ["autotranslate"]
concurrency = ["multiprocessing", "thread"]
parallel = true
relative_files = true
command_line = "-m pytest --cov=autotranslate"

[tool.coverage.paths]
source = [
    "src/autotranslate"
]

[tool.pyright]
exclude = ["tests/**/*"]
include = [
    "src/autotranslate",
]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = 
    dj{42}-py{39,310,311}
    dj{50}-py{310,311,312}
    dj{51}-py{310,311,312,313}
    dj{52}-py{311,312,313}
skipsdist = True

[testenv]
changedir = {toxinidir}/tests
commands = django-admin test autotranslate
deps =
    six
    googletrans
    polib
    dj42: Django>=4.2,<5.0
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<6.0
setenv =
    PYTHONPATH = {toxinidir}:{toxinidir}/tests
    DJANGO_SETTINGS_MODULE = test_project.settings
usedevelop = True
"""
